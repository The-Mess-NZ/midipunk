# MidiPunk routing configuration file
## Ports define the available MIDI input and output devices.
## Each port must have a unique `id`.
## `type` can be "USB" or "DIN".
## `direction` can be "INPUT" or "OUTPUT".
## `label` is a human-readable name for the port.
## For DIN ports, `device` specifies the system device path.
ports:
  - id: "1"
    type: "USB"
    direction: "INPUT"
    label: "88 Keys In"
  - id: "2"
    type: "USB"
    direction: "OUTPUT"
    label: "JT-4000 Output"
  - id: "din1"
    type: "DIN"
    device: "/dev/ttyAMA2"
    direction: "INPUT"
    label: "SQ-64 In"
## Routes define how MIDI messages are routed from inputs to outputs.
## If `channel` is specified, only messages to/from that channel are routed on that port.
## If `channel` is omitted, messages are routed to/from all channels on that port.
routes:
  - inputs:
      - port_id: "1"
      - port_id: "din1"
    outputs:
      - port_id: "2"
        channel: 2
